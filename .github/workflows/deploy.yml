# Build and publish the actants documentation site to GitHub Pages.
#
# The API reference is generated from the real actants source, so this workflow
# checks the product repo out alongside the docs. mkdocs.yml points mkdocstrings
# at src-checkout/src — that is what keeps the reference from drifting.
#
# Runs on every push to main, and weekly so generated reference content tracks
# the product repo even when the docs themselves have not changed.

name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out actants source for API reference
        uses: actions/checkout@v4
        with:
          repository: openintelligence-labs/actants
          path: src-checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        # --strict turns broken links and nav warnings into failures, so a bad
        # link never reaches the published site.
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
